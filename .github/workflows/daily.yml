# 每日自动更新：抓取 → 剪藏 → 生成 content → 构建前端 → 部署到 Cloudflare Pages
# 需要 3 个 GitHub Secrets：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / PUBLIC_API_BASE
name: daily

on:
  schedule:
    # 北京时间每天 06:00（UTC 前一天 22:00）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装管道依赖
        run: pip install -e "./pipeline[dev]"

      - name: 抓取 + 生成 + 剪藏
        run: python -m kaogong --content-dir content

      - name: 提交当日内容
        run: |
          git config user.name "kaogong-bot"
          git config user.email "kaogong-bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "今日无变化"
          else
            git commit -m "每日更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        env:
          PUBLIC_API_BASE: ${{ secrets.PUBLIC_API_BASE }}
        run: pnpm --filter @kaogong/web build

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy apps/web/dist --project-name kaogong-web --branch=main
