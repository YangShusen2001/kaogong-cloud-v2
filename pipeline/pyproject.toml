[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaogong-pipeline"
version = "0.1.0"
description = "考公日报内容管道：抓取官方来源 → 产出结构化 content/ JSON"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tzdata>=2024.1",
  "python-multipart>=0.0.9",
  "fonttools>=4.0",
  "brotli",
]
review = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tzdata>=2024.1",
  "python-multipart>=0.0.9",
  "fonttools>=4.0",
  "brotli",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
